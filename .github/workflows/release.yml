name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Quality Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run tests
        run: cargo test --locked --all-targets

      - name: Run Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

  build:
    name: Build - ${{ matrix.target }}
    needs: quality
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # 1. Windows (x86_64 64位)
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: tran-x86_64-pc-windows-msvc.exe
            binary_source: tran.exe
            use_cross: false

          # 2. macOS (Apple Silicon M 芯片 aarch64)
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: tran-aarch64-apple-darwin
            binary_source: tran
            use_cross: false

          # 3. Linux 静态二进制 (x86_64 64位)
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            artifact_name: tran-x86_64-unknown-linux-musl
            binary_source: tran
            use_cross: true

          # 4. Linux 静态二进制 (ARM64 / aarch64)
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            artifact_name: tran-aarch64-unknown-linux-musl
            binary_source: tran
            use_cross: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross (for cross-compilation)
        if: matrix.use_cross
        run: cargo install cross --version 0.2.5 --locked

      - name: Build binary
        run: |
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --release --locked --target ${{ matrix.target }}
          else
            cargo build --release --locked --target ${{ matrix.target }}
          fi
        shell: bash

      - name: Copy direct binary
        run: |
          cp target/${{ matrix.target }}/release/${{ matrix.binary_source }} ${{ matrix.artifact_name }}
        shell: bash

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: ${{ matrix.artifact_name }}

  release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release files
        run: |
          mkdir -p release_dist
          find artifacts -type f -name "tran-*" -exec cp {} release_dist/ \;
          chmod +x release_dist/tran-* || true
          sha256sum release_dist/tran-* > release_dist/SHA256SUMS
          ls -la release_dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release_dist/*
          draft: false
          prerelease: false
          generate_release_notes: true
