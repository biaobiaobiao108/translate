name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"

jobs:
  build:
    name: Build - ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # 1. Windows (x86_64 64位)
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: translate-x86_64-pc-windows-msvc.exe
            binary_source: translate.exe
            use_cross: false

          # 2. macOS (Apple Silicon M 芯片 aarch64)
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: translate-aarch64-apple-darwin
            binary_source: translate
            use_cross: false

          # 3. Debian / Ubuntu (x86_64 64位)
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: translate-x86_64-unknown-linux-gnu
            binary_source: translate
            use_cross: false

          # 4. Debian / Ubuntu (ARM64 / aarch64)
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact_name: translate-aarch64-unknown-linux-gnu
            binary_source: translate
            use_cross: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross (for cross-compilation)
        if: matrix.use_cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build binary
        run: |
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi
        shell: bash

      - name: Copy direct binary
        run: |
          cp target/${{ matrix.target }}/release/${{ matrix.binary_source }} ${{ matrix.artifact_name }}
        shell: bash

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: ${{ matrix.artifact_name }}

  release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release files
        run: |
          mkdir -p release_dist
          find artifacts -type f -name "translate-*" -exec cp {} release_dist/ \;
          chmod +x release_dist/translate-* || true
          ls -la release_dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release_dist/*
          draft: false
          prerelease: false
          generate_release_notes: true
