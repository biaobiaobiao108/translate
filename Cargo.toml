[package]
name = "tran"
version = "0.3.0"
edition = "2021"
description = "现代快速、美观的 CLI 翻译与词典工具"
license = "MIT"
readme = "README.md"
repository = "https://github.com/biaobiaobiao108/translate"

[dependencies]
tokio = { version = "1.43", features = ["macros", "rt-multi-thread"] }
clap = { version = "4.5", features = ["derive"] }
reqwest = { version = "0.12", features = ["json", "socks", "rustls-tls"], default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.32", features = ["bundled"] }
colored = "3.0"
dirs = "6.0"
thiserror = "2.0"
unicode-width = "0.2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
