<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f2335" />
      <stop offset="100%" stop-color="#16161e" />
    </linearGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7aa2f7" />
      <stop offset="100%" stop-color="#bb9af7" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7dcfff" />
      <stop offset="100%" stop-color="#2ac3de" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" stroke="#292e42" stroke-width="6" />

  <!-- Central Dual-Card Translation Motif -->
  <g transform="translate(56, 72)">
    <!-- Left Card: A (Source) -->
    <rect x="0" y="0" width="210" height="270" rx="24" fill="#24283b" stroke="#7aa2f7" stroke-width="4" opacity="0.95" />
    <text x="105" y="185" font-family="ui-sans-serif, system-ui, sans-serif" font-weight="800" fill="url(#brandGrad)" text-anchor="middle">A</text>
    
    <!-- Right Card: 文 (Target) -->
    <rect x="190" y="90" width="210" height="270" rx="24" fill="#1a1b26" stroke="#7dcfff" stroke-width="4" opacity="0.98" filter="url(#glow)" />
    <text x="295" y="280" font-family="ui-sans-serif, system-ui, sans-serif" font-weight="800" fill="url(#cyanGrad)" text-anchor="middle">&#x26fd;</text>
    
    <!-- Bridge Exchange Arrows -->
    <g transform="translate(170, 75)">
      <circle cx="30" cy="30" r="34" fill="#1f2335" stroke="#e0af68" stroke-width="3.5" />
      <path d="M18 25 L38 25 M32 19 L38 25 L32 31" fill="none" stroke="#7aa2f7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M42 35 L22 35 M28 41 L22 35 L28 29" fill="none" stroke="#ff9e64" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    </g>
  </g>

  <!-- Panda Mascot Badge -->
  <g transform="translate(320, 320)">
    <circle cx="72" cy="72" r="76" fill="#1a1b26" stroke="#bb9af7" stroke-width="5" />
    <clipPath id="pandaClip">
      <circle cx="72" cy="72" r="71" />
    </clipPath>
    <image href="panda.png" x="-8" y="-8" width="160" height="160" clip-path="url(#pandaClip)" />
  </g>
</svg>
